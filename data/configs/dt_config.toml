[train_config]
batch_size = 16
gradient_accumulation_steps = 30
learning_rate = 6e-4
max_steps = 600000
weight_decay = 1e-1
betas = [0.9, 0.95]
grad_clip = 1.0
decay_lr = true
warmup_steps = 2000
lr_decay_steps = 600000
min_lr = 6e-5
dtype = "bfloat16"
compile = true
device = "cpu"
seed = 42
max_timestep = 2000

[model_config]
vocab_size = 32768
block_size = 512
n_embd = 768
n_head = 12
n_layer = 12
embd_pdrop = 0.1
attn_pdrop = 0.1
resid_pdrop = 0.1
model_type = "reward_conditioned"

[rewards]

[[reward.functions]]
type = "QED"