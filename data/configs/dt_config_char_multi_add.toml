[train_config]
batch_size = 64
gradient_accumulation_steps = 30
learning_rate = 1e-4
max_steps = 500000
weight_decay = 1e-1
betas = [0.9, 0.95]
grad_clip = 1.0
decay_lr = true
warmup_steps = 2000
lr_decay_steps = 300000
min_lr = 1e-5
dtype = "bfloat16"
compile = true
device = "cuda"
seed = 42

[model_config]
vocab_size = 37
block_size = 300
n_embd = 768
n_head = 12
n_layer = 12
embd_pdrop = 0.1
attn_pdrop = 0.1
resid_pdrop = 0.1
model_type = "reward_conditioned"
max_timestep = 0

[reward]
agg = "add"

[[reward.functions]]
type = "QED"
scale.name = "mult"
scale.factor = 0.5

[[reward.functions]]
type = "PlogP"
scale.name = "minmax"
scale.min_value = -1.0
scale.max_value = 5.07272
scale.new_max = 0.5
